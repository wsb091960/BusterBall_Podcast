name: Build Buster Ball WAV

on:
  push:
    paths:
      - "Buster_Ball_*.md"
  workflow_dispatch:
    inputs:
      report:
        description: "Markdown report filename"
        required: true
        default: "Buster_Ball_SFG_at_LAD_2026-09-18.md"

permissions:
  contents: read

jobs:
  build-wav:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate R2 configuration before generating paid narration
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os
          required = ('R2_ACCOUNT_ID', 'R2_BUCKET', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure R2 before generating narration. Missing: ' + ', '.join(missing))
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install openai pillow
          python -m pip install -r requirements-storage.txt

      - name: Select report
        id: report
        shell: bash
        env:
          MANUAL_REPORT: ${{ github.event.inputs.report }}
        run: |
          if [ -n "$MANUAL_REPORT" ]; then
            REPORT="$MANUAL_REPORT"
          else
            REPORT="$(git diff-tree --root --no-commit-id --name-only -r HEAD | grep -E '^Buster_Ball_.*\.md$' | head -n 1)"
          fi
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "No matching Buster Ball Markdown report was found."
            exit 1
          fi
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          mkdir -p media-output
          echo "wav=media-output/$(basename "${REPORT%.*}").wav" >> "$GITHUB_OUTPUT"

      - name: Generate WAV narration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT: ${{ steps.report.outputs.report }}
          WAV: ${{ steps.report.outputs.wav }}
        run: |
          python buster_ball_report_to_wav.py \
            "$REPORT" \
            --output "$WAV" \
            --overwrite

      - name: Upload and verify private R2 audio
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          WAV: ${{ steps.report.outputs.wav }}
        run: python media_storage.py "$WAV" --prefix podcast --manifest media-manifest.json

      - name: Retain small media reference manifest
        uses: actions/upload-artifact@v4
        with:
          name: buster-ball-media-manifest
          path: media-manifest.json
          if-no-files-found: error
          retention-days: 30

